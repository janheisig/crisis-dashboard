name: Build and deploy to GitHub Pages

on:
  push:
    branches: [main]
  # Daily refresh of the IMF PortWatch chokepoint data (06:17 UTC).
  schedule:
    - cron: '17 6 * * *'
  workflow_dispatch:

# GITHUB_TOKEN needs write access to push the compiled site to gh-pages
# and to commit the refreshed data snapshot to main.
permissions:
  contents: write

concurrency:
  group: pages-deploy
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      # If PortWatch is unreachable, the build continues with the committed snapshot.
      - name: Refresh IMF PortWatch chokepoint data
        id: refresh
        continue-on-error: true
        run: node scripts/fetch-portwatch.mjs

      - name: Refresh IMF PortWatch port data
        id: refresh-ports
        continue-on-error: true
        run: node scripts/fetch-ports.mjs

      - name: Commit refreshed data snapshot
        if: steps.refresh.outcome == 'success' || steps.refresh-ports.outcome == 'success'
        run: |
          if git diff --quiet -- public/data/chokepoints.json public/data/ports.json; then
            echo "Data unchanged."
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add public/data/chokepoints.json public/data/ports.json
            git commit -m "data: refresh PortWatch chokepoint and port data [skip ci]"
            git push
          fi

      - name: Type-check and build (npm run build)
        run: npm run build

      - name: Disable Jekyll processing
        run: touch dist/.nojekyll

      - name: Deploy ./dist to gh-pages branch
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
          publish_branch: gh-pages
          force_orphan: true
          user_name: github-actions[bot]
          user_email: 41898282+github-actions[bot]@users.noreply.github.com
          commit_message: 'deploy: ${{ github.sha }}'
