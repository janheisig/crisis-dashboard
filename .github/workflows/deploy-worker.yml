name: Deploy AIS relay (Cloudflare Worker)

# Deploys worker/ to Cloudflare, stores the aisstream.io key as a Worker secret,
# writes the Worker URL to public/data/ais-config.json and redeploys the dashboard.
#
# Required repository secrets:
#   CLOUDFLARE_API_TOKEN   (template "Edit Cloudflare Workers")
#   CLOUDFLARE_ACCOUNT_ID
#   AISSTREAM_API_KEY      (from https://aisstream.io)

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['worker/**']

permissions:
  contents: write
  actions: write

concurrency:
  group: worker-deploy
  cancel-in-progress: false

jobs:
  deploy-worker:
    runs-on: ubuntu-latest
    env:
      HAS_CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN != '' }}
    steps:
      - name: Stop if Cloudflare secrets are missing
        if: env.HAS_CF_TOKEN != 'true'
        run: |
          echo "::warning::CLOUDFLARE_API_TOKEN is not set. See README, section 'Live vessel tracking'."
          exit 0

      - name: Check out repository
        if: env.HAS_CF_TOKEN == 'true'
        uses: actions/checkout@v4

      - name: Set up Node.js
        if: env.HAS_CF_TOKEN == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install and test worker
        if: env.HAS_CF_TOKEN == 'true'
        working-directory: worker
        run: |
          npm ci
          npm run typecheck
          npm test

      - name: Deploy worker and set API key secret
        if: env.HAS_CF_TOKEN == 'true'
        id: wrangler
        uses: cloudflare/wrangler-action@v4
        env:
          AISSTREAM_API_KEY: ${{ secrets.AISSTREAM_API_KEY }}
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: worker
          secrets: |
            AISSTREAM_API_KEY

      - name: Publish Worker URL to the dashboard config
        if: env.HAS_CF_TOKEN == 'true'
        env:
          DEPLOYMENT_URL: ${{ steps.wrangler.outputs.deployment-url }}
          COMMAND_OUTPUT: ${{ steps.wrangler.outputs.command-output }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          URL="$DEPLOYMENT_URL"
          if [ -z "$URL" ]; then
            URL=$(printf '%s' "$COMMAND_OUTPUT" | grep -Eo 'https://[a-zA-Z0-9.-]+\.workers\.dev' | head -n1)
          fi
          if [ -z "$URL" ]; then
            echo "::error::Could not determine the Worker URL from the wrangler output."
            exit 1
          fi
          echo "Worker URL: $URL"
          curl -fsS "$URL/health" > /dev/null || echo "::warning::Health check did not respond yet."
          printf '{"endpoint":"%s"}\n' "$URL" > public/data/ais-config.json
          if git diff --quiet -- public/data/ais-config.json; then
            echo "Config unchanged."
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add public/data/ais-config.json
            git commit -m "config: set AIS relay endpoint [skip ci]"
            git pull --rebase origin main
            git push
          fi
          # Commits made with GITHUB_TOKEN do not trigger workflows, so start the site build explicitly.
          gh workflow run deploy.yml --ref main
